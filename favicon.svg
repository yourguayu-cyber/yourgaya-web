<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: Deep Obsidian Forest Green -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#072316" />
      <stop offset="50%" stop-color="#03120a" />
      <stop offset="100%" stop-color="#010604" />
    </radialGradient>
    
    <!-- Outer Glowing Emerald Border -->
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dunkel Leuchtendes Grün für das Y Emblem -->
    <linearGradient id="glowingY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glowing Core Accent -->
    <linearGradient id="coreGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Intense Emerald Ambient Shadow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Forest Dark Green Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGlow)" stroke="url(#emeraldBorder)" stroke-width="9" />

  <!-- Inner Ambient Ring -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="#00e676" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Glowing Green Y Emblem -->
  <g filter="url(#glow)">
    <!-- Left Arm -->
    <polygon points="112,118 206,118 256,236 198,256" fill="url(#glowingY)" />
    
    <!-- Right Arm -->
    <polygon points="400,118 306,118 256,236 314,256" fill="url(#glowingY)" />

    <!-- Center Stem -->
    <polygon points="224,246 288,246 288,396 224,396" fill="url(#glowingY)" />

    <!-- Energetic Glowing Cellular Core -->
    <path d="M 256,142 C 282,185 282,222 256,252 C 230,222 230,185 256,142 Z" fill="url(#coreGlow)" />

    <!-- Bottom Energy Dot -->
    <circle cx="256" cy="422" r="8" fill="#00ff88" />
  </g>
</svg>
